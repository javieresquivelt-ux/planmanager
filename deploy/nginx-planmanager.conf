# nginx para PlanManager — escucha en el puerto 8010 (HTTP)
# El puerto 8000 ya lo usa otro proyecto; Traefik (80/443) no se toca.
server {
    listen 8010;
    server_name cystec.cloud 89.117.32.46;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/planmanager/staticfiles/;
    }

    location /media/ {
        alias /opt/planmanager/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
