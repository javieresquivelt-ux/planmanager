services:
  db:
    image: postgres:16-alpine
    container_name: planmanager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planmanager_db}
      POSTGRES_USER: ${POSTGRES_USER:-planmanager_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planmanager_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planmanager_user} -d ${POSTGRES_DB:-planmanager_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
