# ===========================================================================
# pyproject.toml — Configuración centralizada del proyecto
# Proyecto: Gestor de Proyectos con Roles (Django server-driven)
# ===========================================================================

[project]
name = "planmanager"
version = "0.1.0"
description = "Gestor de Proyectos con Roles"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.3",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planmanager"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
exclude = ["(^|/)tests\\.py$"]

[tool.django-stubs]
django_settings_module = "planmanager.settings.local"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "planmanager.settings.local"
testpaths = ["users", "core", "projects", "tasks"]
python_files = ["tests.py", "test_*.py"]
addopts = "-q"
