{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Iniciar sesión" %} · {{ site.site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="card">
        <h1 class="mb-6 text-2xl font-semibold">{% trans "Iniciar sesión" %}</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn-primary w-full">{% trans "Entrar" %}</button>
        </form>
        <p class="mt-4 text-center text-sm">
            {% trans "¿No tienes cuenta?" %}
            <a href="{% url 'users:register' %}" class="text-brand-600 hover:underline">{% trans "Regístrate" %}</a>
        </p>
    </div>
</div>
{% endblock %}
