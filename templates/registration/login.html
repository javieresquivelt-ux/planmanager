{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Iniciar sesión" %} · {{ site.site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="card">
        <div class="mb-6 flex flex-col items-center gap-3">
            <span class="brand-mark h-12 w-12 text-lg">PM</span>
            <h1 class="text-2xl font-semibold">{% trans "Iniciar sesión" %}</h1>
        </div>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn-primary w-full">{% trans "Entrar" %}</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600 dark:text-gray-400">
            {% trans "¿No tienes cuenta?" %}
            <a href="{% url 'users:register' %}" class="text-brand-600 dark:text-brand-400 font-medium hover:underline">{% trans "Regístrate" %}</a>
        </p>
    </div>
</div>
{% endblock %}
