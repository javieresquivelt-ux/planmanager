{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Registrarse" %} · {{ site.site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="card">
        <div class="mb-6 flex flex-col items-center gap-3">
            <span class="brand-mark h-12 w-12 text-lg">PM</span>
            <h1 class="text-2xl font-semibold">{% trans "Registrarse" %}</h1>
        </div>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary w-full">{% trans "Crear cuenta" %}</button>
        </form>
        <p class="mt-4 text-center text-sm">
            {% trans "¿Ya tienes cuenta?" %}
            <a href="{% url 'users:login' %}" class="text-brand-600 hover:underline">{% trans "Inicia sesión" %}</a>
        </p>
    </div>
</div>
{% endblock %}
