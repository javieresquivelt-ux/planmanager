{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="mx-auto max-w-md">
    <div class="mb-3">
        <a href="{{ object.get_absolute_url }}" class="inline-flex items-center gap-1.5 text-sm font-medium text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors group">
            <svg class="h-4 w-4 transition-transform group-hover:-translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span>{% trans "Volver al Proyecto" %}</span>
        </a>
    </div>
    <div class="card">
        <h1 class="mb-4 text-xl font-semibold">{% trans "Eliminar proyecto" %}</h1>
        <p class="mb-6">{% trans "¿Seguro que quieres eliminar" %} "{{ object }}"?</p>
        <form method="post" class="flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn-danger">{% trans "Sí, eliminar" %}</button>
            <a href="{{ object.get_absolute_url }}" class="btn-secondary">{% trans "Cancelar" %}</a>
        </form>
    </div>
</div>
{% endblock %}
