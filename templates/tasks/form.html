{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="card">
        <h1 class="mb-6 text-2xl font-semibold">
            {% if object %}{% trans "Editar tarea" %}{% else %}{% trans "Nueva tarea" %}{% endif %}
        </h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary w-full">{% trans "Guardar" %}</button>
        </form>
    </div>
</div>
{% endblock %}
