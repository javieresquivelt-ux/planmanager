{% load i18n %}
<div id="task-status" hx-target="#task-status" hx-swap="outerHTML" class="card mb-6">
    <p class="mb-3 text-sm">{% trans "Estado" %}: <strong>{{ task.get_status_display }}</strong></p>
    {% if can_edit %}
        <div class="flex flex-wrap gap-2">
            {% for value, label in task.Status.choices %}
                <form method="post" action="{% url 'tasks:status' task.project_id task.pk %}"
                      hx-post="{% url 'tasks:status' task.project_id task.pk %}">
                    {% csrf_token %}
                    <input type="hidden" name="status" value="{{ value }}">
                    <button type="submit" class="{% if task.status == value %}btn-brand{% else %}btn-secondary{% endif %}"
                            {% if task.status == value %}disabled{% endif %}>{{ label }}</button>
                </form>
            {% endfor %}
        </div>
    {% endif %}
</div>
